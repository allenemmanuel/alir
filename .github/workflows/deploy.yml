# Rebuilds the site and publishes it to Firebase whenever main changes
# (for example, when someone clicks Publish in the editor at /admin).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python build.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting:alirsabah --project alir-80c4f --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
